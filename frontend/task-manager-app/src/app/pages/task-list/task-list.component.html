<div class="page-container">
  <div class="header-section">
    <div>
      <h1 class="page-title">Your Tasks</h1>
    </div>
    <button class="btn btn-primary" (click)="newTask()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New Task
    </button>
  </div>

  <div class="empty-state glass-panel" *ngIf="tasks.length === 0">
    <div class="empty-content">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <h3>Empty</h3>
      <p>You have no pending tasks</p>
    </div>
  </div>

  <div class="task-grid" *ngIf="tasks.length > 0">
    <div class="task-card glass-panel" *ngFor="let task of tasks">
      <div class="card-header">
        <div class="badges">
          <span class="badge" [ngClass]="getPriorityClass(task.priority)">{{ task.priority }}</span>
          <span class="badge" [ngClass]="getStatusClass(task.status)">{{ task.status }}</span>
        </div>
        <div class="card-actions">
          <button class="icon-btn edit-btn" (click)="editTask(task.id!)" title="Edit">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          </button>
          <button class="icon-btn delete-btn" (click)="deleteTask(task.id!)" title="Delete">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
          </button>
        </div>
      </div>
      
      <div class="card-body">
        <h3 class="task-title">{{ task.title }}</h3>
        <p class="task-description" *ngIf="task.description">{{ task.description }}</p>
        <p class="task-date">Created on {{ task.createdAt | date:'MM/dd/yyyy • HH:mm' }}</p>
      </div>
    </div>
  </div>
</div>
